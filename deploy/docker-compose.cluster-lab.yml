# One copy per Colima VM. Each project has independent Docker volumes.
name: logister-cluster-lab
services:
  kafka:
    image: ${LAB_KAFKA_IMAGE:-apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed}
    network_mode: host
    environment:
      CLUSTER_ID: ${LAB_KAFKA_ID:?}
      KAFKA_NODE_ID: ${LAB_NODE:?}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://${LAB_IP:?}:29092,CONTROLLER://${LAB_IP:?}:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${LAB_IP:?}:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${LAB_KAFKA_VOTERS:?}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_RETENTION_BYTES: "268435456"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - kafka:/var/lib/kafka/data

  opensearch:
    image: ${LAB_SEARCH_IMAGE:-opensearchproject/opensearch:2.17.1@sha256:1193b7c29c5d63028523728243cc4da047ac49f697a8f8105e5aeee2f89bcc4c}
    network_mode: host
    environment:
      cluster.name: logister-colima-lab
      node.name: lab-${LAB_NODE:?}
      network.host: ${LAB_IP:?}
      http.port: "19200"
      transport.port: "19300"
      discovery.seed_hosts: ${LAB_SEARCH_SEEDS:?}
      cluster.initial_cluster_manager_nodes: lab-1,lab-2,lab-3
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms384m -Xmx384m"
    volumes:
      - opensearch:/usr/share/opensearch/data

  mongo:
    image: ${LAB_MONGO_IMAGE:-mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142}
    network_mode: host
    command: ["mongod", "--bind_ip", "${LAB_IP:?}", "--port", "27217", "--replSet", "logister-lab", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo:/data/db

  redis:
    profiles: [journal]
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    network_mode: host
    command: ["redis-server", "--bind", "${LAB_IP:?}", "--port", "16379", "--protected-mode", "no", "--appendonly", "yes"]
    volumes:
      - redis:/data

  api:
    profiles: [app]
    image: logister-api:local
    hostname: logister-lab-${LAB_NODE:?}
    environment:
      MONITORING_NODE_ID: logister-lab-${LAB_NODE:?}
      DATABASE_URL: mongodb://${LAB_MONGO_SEEDS:?}/logister?replicaSet=logister-lab
      REDIS_URL: redis://${LAB_REDIS_HOST:?}:16379
      OPENSEARCH_URL: http://${LAB_IP:?}:19200
      OPENSEARCH_INDEX: logs
      KAFKA_BROKERS: ${LAB_KAFKA_SEEDS:?}
      KAFKA_DIRECT: "${KAFKA_DIRECT:-false}"
      KAFKA_TOPIC: logister-ingest
      KAFKA_GROUP: logister
      HTTP_ADDR: ":8080"
      CORS_ORIGIN: http://localhost:${LAB_UI_PORT:?}
      SEED_SAMPLE_LOGS: "false"
      AUTH_ENABLED: "true"
      AUTH_COOKIE_SECURE: "false" # The lab UI is served over HTTP on localhost.
      AUTH_SETTINGS_KEY: ${LAB_AUTH_SETTINGS_KEY:?}
      AUTH_LOCAL_PASSWORD: ${LAB_ADMIN_PASSWORD:?}
      INGEST_WORKERS: "2"
      BULK_WORKERS: "2"
      BULK_MAX_BYTES: "6291456"
      OPENSEARCH_SHARDS: "3"
    ports:
      - "127.0.0.1:${LAB_API_PORT:?}:8080"

  ui:
    profiles: [app]
    image: logister-ui:local
    ports:
      - "127.0.0.1:${LAB_UI_PORT:?}:80"
    depends_on:
      - api

volumes:
  kafka:
  opensearch:
  mongo:
  redis:
