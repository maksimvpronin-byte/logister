include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
pidfile /run/slapd/slapd.pid
argsfile /run/slapd/slapd.args
modulepath /usr/lib/ldap
moduleload back_mdb
moduleload memberof
moduleload refint

database mdb
maxsize 1073741824
suffix "dc=logister,dc=test"
rootdn "cn=admin,dc=logister,dc=test"
rootpw @ADMIN_HASH@
directory /var/lib/ldap
index objectClass eq
index uid,cn,entryUUID eq
index member,memberOf eq

access to attrs=userPassword
    by self write
    by anonymous auth
    by * none
access to *
    by dn.exact="uid=ldap-reader,ou=services,dc=logister,dc=test" read
    by users read
    by * none

overlay memberof
memberof-group-oc groupOfNames
memberof-member-ad member
memberof-memberof-ad memberOf
memberof-refint TRUE

overlay refint
refint_attributes member
refint_nothing "cn=empty,ou=services,dc=logister,dc=test"
