# Development pipeline for the host API. Build images from the project root:
# docker compose build loggen fluent-bit

services:
  loggen:
    image: logister-loggen:local
    environment:
      LOG_FILE: /logs/app.log
      LOG_HOST: app-01
      INTERVAL_MS: "${LOG_INTERVAL_MS:-700}"
      ROTATE_EVERY: "${LOG_ROTATE_EVERY:-500}"
      MAX_MESSAGES: "${LOG_MAX_MESSAGES:-0}"
    volumes:
      - loggen_data:/logs
    restart: unless-stopped

  fluent-bit:
    image: logister-fluent-bit:local
    environment:
      INGEST_HOST: "${INGEST_HOST:-host.docker.internal}"
      INGEST_PORT: "${INGEST_PORT:-8080}"
    volumes:
      - loggen_data:/logs:ro
      - fluent_bit_state:/var/lib/fluent-bit
    ports:
      - "127.0.0.1:${FLUENT_BIT_PORT:-2020}:2020"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - loggen
    restart: unless-stopped

volumes:
  loggen_data:
  fluent_bit_state:
