version: "3.8"

services:
  loggen:
    image: busybox:1.36
    command: ["sh", "/scripts/generate.sh"]
    environment:
      LOG_FILE: /logs/app.log
      LOG_HOST: app-01
      INTERVAL_MS: "700"
    volumes:
      - ./runtime/loggen/generate.sh:/scripts/generate.sh:ro
      - loggen_data:/logs
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.2.2
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    environment:
      INGEST_HOST: host.docker.internal
      INGEST_PORT: "8080"
    volumes:
      - ./runtime/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./runtime/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - loggen_data:/logs:ro
    ports:
      - "2020:2020"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - loggen
    restart: unless-stopped

volumes:
  loggen_data:
