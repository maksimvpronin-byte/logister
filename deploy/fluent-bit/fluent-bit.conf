[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Path              /logs/app.log
    Tag               logister.*
    Refresh_Interval  1
    Read_from_Head    On
    Mem_Buf_Limit     5MB

[OUTPUT]
    Name            http
    Match           logister.*
    Host            ${INGEST_HOST}
    Port            ${INGEST_PORT}
    URI             /api/ingest/json
    Format          json
    Json_date_key   false
    Header          Content-Type application/json
    Retry_Limit     5
