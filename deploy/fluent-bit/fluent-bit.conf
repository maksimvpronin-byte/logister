[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Parsers_File  /fluent-bit/etc/parsers.conf
    storage.path              /var/lib/fluent-bit/buffer
    storage.sync              full
    storage.checksum          On
    storage.max_chunks_up     8
    storage.backlog.mem_limit 5M

[INPUT]
    Name              tail
    Path              /logs/app.log*
    Parser            json
    Tag               logister.*
    Refresh_Interval  1
    Read_from_Head    On
    DB                /var/lib/fluent-bit/tail.db
    DB.sync           full
    DB.locking        true
    storage.type      filesystem

[FILTER]
    Name              record_modifier
    Match             logister.*
    Uuid_Key          delivery_id

[OUTPUT]
    Name            http
    Match           logister.*
    Host            ${INGEST_HOST}
    Port            ${INGEST_PORT}
    URI             /api/ingest/fluent-bit
    Format          json
    Json_date_key   false
    Header          Content-Type application/json
    Retry_Limit     no_limits
