[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Parsers_File  /fluent-bit/etc/parsers.conf
    storage.path              /var/lib/fluent-bit/buffer
    storage.sync              full
    storage.checksum          On
    storage.max_chunks_up     8
    storage.backlog.mem_limit 5M

[INPUT]
    Name              tail
    Path              /logs/app.log*
    Parser            json
    Tag               logister.*
    Refresh_Interval  1
    Read_from_Head    On
    DB                /var/lib/fluent-bit/tail.db
    DB.sync           full
    DB.locking        true
    storage.type      filesystem

[FILTER]
    Name              record_modifier
    Match             logister.*
    Uuid_Key          delivery_id

[OUTPUT]
    Name            kafka
    Match           logister.*
    Brokers         ${KAFKA_BROKERS}
    Topics          ${KAFKA_TOPIC}
    Format          json
    timestamp_key   __logister_kafka_timestamp
    message_key_field delivery_id
    queue_full_retries 0
    rdkafka.request.required.acks -1
    rdkafka.enable.idempotence true
    rdkafka.message.timeout.ms 0
    Retry_Limit     no_limits
