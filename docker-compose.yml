services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: logister
      POSTGRES_PASSWORD: logister
      POSTGRES_DB: logister
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logister -d logister"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.1@sha256:1193b7c29c5d63028523728243cc4da047ac49f697a8f8105e5aeee2f89bcc4c
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 357913941
      KAFKA_LOG_SEGMENT_BYTES: 33554432
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:19092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "logister-ingest", "--partitions", "6", "--replication-factor", "1"]

  api:
    image: logister-api:local
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: logister-ingest
      KAFKA_GROUP: logister
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://logister:logister@postgres:5432/logister?sslmode=disable
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: logs
      CORS_ORIGIN: http://localhost:3000
      SEED_SAMPLE_LOGS: "${SEED_SAMPLE_LOGS:-false}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  ui:
    image: logister-ui:local
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:80"
    depends_on:
      - api

  loggen:
    image: logister-loggen:local
    build: ./deploy/loggen
    environment:
      INTERVAL_MS: "${LOG_INTERVAL_MS:-700}"
      ROTATE_EVERY: "${LOG_ROTATE_EVERY:-500}"
      MAX_MESSAGES: "${LOG_MAX_MESSAGES:-0}"
    volumes:
      - loggen_data:/logs
    restart: unless-stopped

  fluent-bit:
    image: logister-fluent-bit:local
    build: ./deploy/fluent-bit
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: logister-ingest
    volumes:
      - loggen_data:/logs:ro
      - fluent_bit_state:/var/lib/fluent-bit
    ports:
      - "127.0.0.1:${FLUENT_BIT_PORT:-2020}:2020"
    depends_on:
      - kafka-init
      - api
      - loggen
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  osdata:
  loggen_data:
  fluent_bit_state:
  kafka_data:
